services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alltix_oms}
      POSTGRES_USER: ${POSTGRES_USER:-alltix_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_admin}
    ports:
      - "5432:5432"
    volumes:
      - alltix_pg_data:/var/lib/postgresql/data

volumes:
  alltix_pg_data:
